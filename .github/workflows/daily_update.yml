name: Daily GitHub Top 500 Update

on:
  workflow_dispatch:

  schedule:
    - cron: "30 17 * * *"

permissions:
  contents: write

jobs:
  update-excel:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Check GROW_HUB secret
        env:
          MY_GITHUB_TOKEN: ${{ secrets.GROW_HUB }}
        run: |
          if [ -z "$MY_GITHUB_TOKEN" ]; then
            echo "❌ GROW_HUB secret was NOT provided"
            exit 1
          else
            echo "✅ GROW_HUB secret was provided"
          fi

      - name: Run GitHub ranking update
        env:
          GITHUB_TOKEN: ${{ secrets.GROW_HUB }}
        run: |
          echo "🚀 Starting GitHub ranking program..."
          python github_ranker.py

      - name: Commit updated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github_top_repos_by_interval.xlsx

          if git diff --cached --quiet; then
            echo "ℹ️ No Excel changes detected."
          else
            git commit -m "Daily GitHub Top 500 update"
            git push
          fi
